[project]
name = "trading-agent-tp"
version = "0.1.0"
description = "AI service trading agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dang Anh Quan", email = "anhquandang@thienphuoc.media" }
]
license = { text = "MIT" }

# Core dependencies
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
    "requests>=2.32.0",
    "apscheduler==3.10.4",
    "chromadb>=1.2.1",
    "pysqlite3>=0.5.4",
    "openai-agents>=0.4.0",
    "python-dotenv>=1.1.1",
    "mysql-connector-python>=9.4.0",
    "pytz>=2024.1",
    "pandas>=2.3.3",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.1.0",
    "tiktoken>=0.12.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "tabulate>=0.9.0",
]

# Optional / dev dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "flake8>=7.1.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["trading_agent_tp"]

# Build configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Black formatter
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | build
  | dist
  | migrations
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
combine_as_imports = true

# pytest settings
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -q --cov=trading_agent_tp --cov-report=term-missing"

# mypy static typing
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
strict_equality = true
no_implicit_optional = true
